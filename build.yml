name: Build Zeus Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Tidak butuh gradlew: Gradle 8.11.1 dipasang langsung oleh action ini
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build jar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZeusClient-jar
          path: build/libs/zeus-client-*.jar
          
